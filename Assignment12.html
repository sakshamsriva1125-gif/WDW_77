<!DOCTYPE html>
<html>
    <head>
        <title>
            Table with Headers ,Caption and footer 
        </title>
    </head>
    <body>
        <p align="center">Student Marks </p>
        <table align="center" border="2">
            <tr>
                <th>Roll No.</th>
                <th>Name </th>
                <th>Marks</th>
            </tr>
            <tr>
                <th>1</th>
                <th>Aman</th>
                <th>85</th>
            </tr>
            <tr>
                <th>2</th>
                <th>Riya</th>
                <th>92</th>

            </tr>
            <tr>
                <th colspan="2" align="center"><b>Average</b></th>
                
                <th>88.5</th>
            </tr>
        </table>
    </body>
</html>
