<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Rowspan And Colspan(Timetable)
        </title>
    </head>
    <body>
        <p align="center">Weekly Timetable</p>
        <table align="center" border=2 cellpading="8" style="text-align: center;" >
            <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>
        <tr>
           <th>Mon</th>
            <th>Maths</th>
             <th>Html</th>
             <th rowspan="2">Web lab</th>
              <tr>
                <th>Tue</th>
                <th>DBMS</th>
                <th>OS</th>
              </tr>
              <th colspan="3">Seminar</th>
    



        
    </body>
</html>
